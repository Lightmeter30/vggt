defaults:
  - default_dataset.yaml
  - _self_

exp_name: euroc_camera_only
img_size: 518
num_workers: 4
seed_value: 42
accum_steps: 1
patch_size: 14
val_epoch_freq: 1
max_img_per_gpu: 8

limit_train_batches: 2
limit_val_batches: 1

vi_datasets:
  euroc:
    dataset_name: euroc
    ASL_DIR: /home/zwr/code/my-vggt/dataset/euRoC
    ASL_ANNOTATION_DIR: /home/zwr/code/my-vggt/dataset/euroc-anno-local
    camera_names: [cam0]
  tum_vi:
    dataset_name: tum_vi
    ASL_DIR: /home/zwr/code/my-vggt/dataset/TUM_VI
    ASL_ANNOTATION_DIR: /home/zwr/code/my-vggt/dataset/tum-vi-anno-local
    camera_names: [cam0]
  kaist_vi:
    dataset_name: kaist_vi
    ASL_DIR: /home/zwr/code/my-vggt/dataset/KAIST_VI
    ASL_ANNOTATION_DIR: /home/zwr/code/my-vggt/dataset/kaist-vi-anno-local
    camera_names: [cam0]
  uma_vi:
    dataset_name: uma_vi
    ASL_DIR: /home/zwr/code/my-vggt/dataset/UMA_VI
    ASL_ANNOTATION_DIR: /home/zwr/code/my-vggt/dataset/uma-vi-anno-local
    camera_names: [cam0, cam1, cam2, cam3]

sequence_splits:
  train:
    euroc: [MH_01_easy, MH_02_easy, MH_03_medium, MH_04_difficult, V1_02_medium, V1_03_difficult, V2_01_easy, V2_03_difficult]
    tum_vi: []
    kaist_vi: []
    uma_vi: []
  val:
    euroc: [MH_05_difficult, V1_01_easy, V2_02_medium]
    tum_vi: []
    kaist_vi: []
    uma_vi: []

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.euroc.dataset_name}
          ASL_DIR: ${vi_datasets.euroc.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.euroc.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.euroc.camera_names}
          sequence_names: ${sequence_splits.train.euroc}
          load_imu: False
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.tum_vi.dataset_name}
          ASL_DIR: ${vi_datasets.tum_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.tum_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.tum_vi.camera_names}
          sequence_names: ${sequence_splits.train.tum_vi}
          load_imu: False
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.kaist_vi.dataset_name}
          ASL_DIR: ${vi_datasets.kaist_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.kaist_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.kaist_vi.camera_names}
          sequence_names: ${sequence_splits.train.kaist_vi}
          load_imu: False
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.uma_vi.dataset_name}
          ASL_DIR: ${vi_datasets.uma_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.uma_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.uma_vi.camera_names}
          sequence_names: ${sequence_splits.train.uma_vi}
          load_imu: False
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.euroc.dataset_name}
          ASL_DIR: ${vi_datasets.euroc.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.euroc.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.euroc.camera_names}
          sequence_names: ${sequence_splits.val.euroc}
          load_imu: False
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.tum_vi.dataset_name}
          ASL_DIR: ${vi_datasets.tum_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.tum_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.tum_vi.camera_names}
          sequence_names: ${sequence_splits.val.tum_vi}
          load_imu: False
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.kaist_vi.dataset_name}
          ASL_DIR: ${vi_datasets.kaist_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.kaist_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.kaist_vi.camera_names}
          sequence_names: ${sequence_splits.val.kaist_vi}
          load_imu: False
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.uma_vi.dataset_name}
          ASL_DIR: ${vi_datasets.uma_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.uma_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.uma_vi.camera_names}
          sequence_names: ${sequence_splits.val.uma_vi}
          load_imu: False

logging:
  log_dir: logs
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 5
  resume_checkpoint_path: /home/zwr/code/my-vggt/ckpt/model.pt
  strict: False

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: "l1"
    use_point_mask: False
  depth: null
  point: null
  track: null

optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05
  frozen_module_names:
    - "*aggregator*"
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ["rescaled", "rescaled"]
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05

max_epochs: 1

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: True
  enable_depth: False
  enable_point: False
  enable_track: False

distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True
