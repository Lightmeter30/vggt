defaults:
  - euroc_camera_only.yaml
  - _self_

exp_name: euroc_imu_film_full_518_s6_mipg12_lr1e-4_new
img_size: 518
max_img_per_gpu: 12
max_epochs: 10
val_epoch_freq: 5
limit_train_batches: 800
limit_val_batches: 400

data:
  train:
    common_config:
      img_nums: [2, 12] # 决定时序跨度和显存分配
      augs:
        aspects: [1.0, 1.0]
    dataset:
      dataset_configs:
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.euroc.dataset_name}
          ASL_DIR: ${vi_datasets.euroc.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.euroc.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.euroc.camera_names}
          sequence_names: ${sequence_splits.train.euroc}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.tum_vi.dataset_name}
          ASL_DIR: ${vi_datasets.tum_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.tum_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.tum_vi.camera_names}
          sequence_names: ${sequence_splits.train.tum_vi}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.kaist_vi.dataset_name}
          ASL_DIR: ${vi_datasets.kaist_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.kaist_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.kaist_vi.camera_names}
          sequence_names: ${sequence_splits.train.kaist_vi}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000
        - _target_: data.datasets.asl.ASLDataset
          split: train
          dataset_name: ${vi_datasets.uma_vi.dataset_name}
          ASL_DIR: ${vi_datasets.uma_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.uma_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.uma_vi.camera_names}
          sequence_names: ${sequence_splits.train.uma_vi}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000
  val:
    common_config:
      img_nums: [6, 6]
      augs:
        aspects: [1.0, 1.0]
    dataset:
      dataset_configs:
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.euroc.dataset_name}
          ASL_DIR: ${vi_datasets.euroc.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.euroc.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.euroc.camera_names}
          sequence_names: ${sequence_splits.val.euroc}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.tum_vi.dataset_name}
          ASL_DIR: ${vi_datasets.tum_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.tum_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.tum_vi.camera_names}
          sequence_names: ${sequence_splits.val.tum_vi}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.kaist_vi.dataset_name}
          ASL_DIR: ${vi_datasets.kaist_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.kaist_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.kaist_vi.camera_names}
          sequence_names: ${sequence_splits.val.kaist_vi}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000
        - _target_: data.datasets.asl.ASLDataset
          split: val
          dataset_name: ${vi_datasets.uma_vi.dataset_name}
          ASL_DIR: ${vi_datasets.uma_vi.ASL_DIR}
          ASL_ANNOTATION_DIR: ${vi_datasets.uma_vi.ASL_ANNOTATION_DIR}
          camera_names: ${vi_datasets.uma_vi.camera_names}
          sequence_names: ${sequence_splits.val.uma_vi}
          load_imu: True
          imu_num_samples: ${model.imu.num_samples}
          imu_window_ns: 100000000

logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - motion_risk_mean
        - motion_risk_std
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - motion_risk_mean
        - motion_risk_std

optim:
  optimizer:
    lr: 1e-4
  gradient_clip:
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["imu_encoder"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["imu_fusion"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-7
              end_value: 1e-4
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-4
              end_value: 1e-6
          lengths: [0.05, 0.95]
          interval_scaling: ["rescaled", "rescaled"]

model:
  imu:
    enabled: true
    num_samples: 32
    input_dim: 6
    hidden_dim: 256
    num_layers: 2
    num_heads: 4
    dropout: 0.1
  fusion:
    enabled: true
    type: film
    insert_at: aggregator_input

distributed:
  find_unused_parameters: True
